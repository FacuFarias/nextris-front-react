<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Imágenes Médicas</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #10131d;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        #viewer-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            background: #10131d;
        }

        #status[hidden] {
            display: none;
        }
    </style>
</head>

<body>
    <div id="status" role="status">Esperando un estudio desde NextRIS…</div>
    <iframe id="viewer-frame" title="Visor DICOM" src="about:blank" allow="fullscreen"></iframe>

    <script>
        const CHANNEL_NAME = 'nextris-dicom-viewer-v1';
        const GEOMETRY_KEY = 'nextris.dicomViewer.geometry.v1';
        const STUDY_UID_PATTERN = /^[0-9]+(?:\.[0-9]+)+$/;
        const GEOMETRY_POLL_INTERVAL = 1000;
        const RESIZE_DEBOUNCE = 250;

        const iframe = document.getElementById('viewer-frame');
        const status = document.getElementById('status');
        const viewerId = createId();
        const channel = new BroadcastChannel(CHANNEL_NAME);
        let lastGeometry = null;
        let resizeTimer = null;

        function createId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }

            return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function isRecord(value) {
            return typeof value === 'object' && value !== null;
        }

        function isValidStudyUID(value) {
            return typeof value === 'string'
                && value.length <= 64
                && STUDY_UID_PATTERN.test(value);
        }

        function isValidViewerUrl(value) {
            if (typeof value !== 'string') return false;

            try {
                const url = new URL(value);
                const validProtocol = url.protocol === 'https:' || url.protocol === 'http:';
                const validPath = url.pathname.endsWith('/set-token.html')
                    || url.pathname.endsWith('/viewer');
                return validProtocol && validPath;
            } catch {
                return false;
            }
        }

        function announceReady(replyTo) {
            channel.postMessage({
                type: 'VIEWER_READY',
                viewerId,
                ...(replyTo ? { replyTo } : {}),
            });
        }

        function loadStudy(message) {
            if (!isValidStudyUID(message.studyInstanceUID) || !isValidViewerUrl(message.viewerUrl)) {
                return;
            }

            status.textContent = 'Cargando estudio…';
            status.hidden = false;
            iframe.src = message.viewerUrl;

            const wrapperUrl = new URL(window.location.href);
            wrapperUrl.searchParams.set('bridge', '2');
            wrapperUrl.searchParams.set('StudyInstanceUIDs', message.studyInstanceUID);
            window.history.replaceState({}, '', `${wrapperUrl.pathname}${wrapperUrl.search}`);

            channel.postMessage({
                type: 'STUDY_ACCEPTED',
                viewerId,
                requestId: message.requestId,
                replyTo: message.sourceId,
            });
        }

        channel.addEventListener('message', function (event) {
            const message = event.data;
            if (!isRecord(message) || typeof message.type !== 'string') return;

            if (message.type === 'VIEWER_PING' && typeof message.sourceId === 'string') {
                announceReady(message.sourceId);
                return;
            }

            if (message.type !== 'OPEN_STUDY') return;
            if (message.targetViewerId !== viewerId) return;
            if (typeof message.sourceId !== 'string' || typeof message.requestId !== 'string') return;

            loadStudy(message);
        });

        iframe.addEventListener('load', function () {
            if (iframe.src !== 'about:blank') {
                status.hidden = true;
            }
        });

        function getGeometry() {
            return {
                x: Math.round(window.screenX),
                y: Math.round(window.screenY),
                width: Math.round(window.outerWidth),
                height: Math.round(window.outerHeight),
            };
        }

        function isValidGeometry(geometry) {
            return Object.values(geometry).every(Number.isFinite)
                && geometry.width >= 640
                && geometry.height >= 480
                && geometry.width <= 10000
                && geometry.height <= 10000
                && Math.abs(geometry.x) <= 100000
                && Math.abs(geometry.y) <= 100000;
        }

        function sameGeometry(left, right) {
            return left && right
                && left.x === right.x
                && left.y === right.y
                && left.width === right.width
                && left.height === right.height;
        }

        function persistGeometry() {
            const geometry = getGeometry();
            if (!isValidGeometry(geometry) || sameGeometry(geometry, lastGeometry)) return;

            try {
                localStorage.setItem(GEOMETRY_KEY, JSON.stringify(geometry));
                lastGeometry = geometry;
            } catch {
                // El visor sigue funcionando aunque el almacenamiento esté deshabilitado.
            }
        }

        function scheduleGeometrySave() {
            window.clearTimeout(resizeTimer);
            resizeTimer = window.setTimeout(persistGeometry, RESIZE_DEBOUNCE);
        }

        const geometryPoll = window.setInterval(persistGeometry, GEOMETRY_POLL_INTERVAL);
        window.addEventListener('resize', scheduleGeometrySave);
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') persistGeometry();
        });

        window.addEventListener('pagehide', function () {
            window.clearInterval(geometryPoll);
            window.clearTimeout(resizeTimer);
            persistGeometry();
            channel.postMessage({ type: 'VIEWER_CLOSED', viewerId });
            channel.close();
        });

        persistGeometry();
        announceReady();
    </script>
</body>

</html>
